[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "subtitle-platform-backend"
version = "0.1.0"
description = "FastAPI backend for the privacy-first multilingual subtitle platform"
requires-python = ">=3.11"
dependencies = [
  "aiofiles==24.1.0",
  "alembic==1.17.2",
  "argon2-cffi==25.1.0",
  "asyncpg==0.31.0",
  "boto3==1.42.24",
  "email-validator==2.3.0",
  "fastapi==0.123.0",
  "greenlet==3.2.4",
  "google-genai==1.52.0",
  "httpx==0.28.1",
  "orjson==3.11.4",
  "passlib==1.7.4",
  "psycopg[binary]==3.2.13",
  "pydantic==2.12.5",
  "pydantic-settings==2.12.0",
  "PyJWT==2.10.1",
  "python-multipart==0.0.20",
  "regex==2025.11.3",
  "SQLAlchemy==2.0.44",
  "structlog==25.5.0",
  "uvicorn[standard]==0.38.0"
]

[project.optional-dependencies]
asr = [
  "faster-whisper==1.2.1",
  "silero-vad==6.2.0",
  "torch==2.9.1"
]
test = [
  "pytest==9.0.1",
  "pytest-asyncio==1.3.0",
  "pytest-cov==7.0.0",
  "respx==0.22.0"
]
dev = [
  "ruff==0.14.6",
  "mypy==1.18.2"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["app"]
