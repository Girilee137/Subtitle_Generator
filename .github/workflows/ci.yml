name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: subtitle_platform_test
          POSTGRES_USER: subtitle
          POSTGRES_PASSWORD: subtitle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U subtitle -d subtitle_platform_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://subtitle:subtitle@localhost:5432/subtitle_platform_test
      JWT_SECRET: ci-secret
      STORAGE_ROOT: /tmp/subtitle-platform-storage
      FAKE_ASR: "1"
      FAKE_GEMINI: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Test backend
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: |
          npx tsc --noEmit
          npm run build

  e2e:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start fake-ASR stack
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build postgres backend worker-default frontend
      - name: Wait for stack
        run: |
          for i in {1..60}; do
            curl -fsS http://localhost:8000/health && curl -fsS http://localhost:5173 && exit 0
            sleep 2
          done
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs
          exit 1
      - name: Run Playwright e2e
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          E2E_API_URL: http://localhost:8000/api/v1
        run: npm run e2e
      - name: Stop fake-ASR stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v
